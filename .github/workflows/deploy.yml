name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # A secret that exists but holds only whitespace passes GitHub's "is set"
      # check and gets baked into the bundle as an empty key, so the live site
      # silently falls back to local data. Fail here instead. Prints lengths only.
      - name: Check required secrets
        run: |
          status=0
          for name in CLOUDFLARE_API_TOKEN USDA_API_KEY OPENROUTER_API_KEY; do
            value="${!name}"
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            echo "$name: ${#value} characters, ${#trimmed} excluding whitespace"
            if [ -z "$trimmed" ]; then
              echo "::error::$name is empty or whitespace only - re-enter it in the repository secrets"
              status=1
            fi
          done
          exit $status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build and Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Astro bakes these into the server bundle at build time and CI has no
          # .env file. Without them the deployed site silently degrades: food
          # search drops to the small local dataset and meal parsing to the basic
          # parser. Secrets stay server-side; they never reach browser code.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
